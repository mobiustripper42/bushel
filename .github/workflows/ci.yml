name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The app + tests read/write this DB (task 10.2). Supabase below is now
    # vestigial (pgTAP only) — admin auth moved to the self-rolled HMAC session
    # (DEC-047, task 10.3). The app verifies and global-setup mints sessions with
    # SESSION_SECRET; any fixed value works as long as both sides share it.
    env:
      DATABASE_URL: postgres://bushel:bushel@localhost:5433/bushel_test
      SESSION_SECRET: ci-fixed-session-secret-not-a-real-key

    # Plain Postgres for the migration runner + tests (DEC-046, task 10.0).
    # Port 5433 matches the local docker-compose mapping so one DATABASE_URL
    # convention works in both places. Supabase steps below coexist until
    # 10.5/10.6 remove them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bushel
          POSTGRES_PASSWORD: bushel
          POSTGRES_DB: bushel_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bushel -d bushel_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Postgres service sanity
        run: psql "postgresql://bushel:bushel@localhost:5433/bushel_test" -c "SELECT 1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Install dependencies
        run: npm ci

      - name: Run migrations (pg data DB)
        run: npx tsx db/migrate.ts "$DATABASE_URL"

      # Typecheck + lint gate (#238 follow-up): neither was a CI gate, so both
      # silently drifted to 50 accumulated errors before anyone noticed. They
      # run in seconds — fail fast, before the build/Playwright spend.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Set Supabase env vars
        run: |
          eval $(supabase status --output env)
          [[ -z "$API_URL" ]] && echo "ERROR: API_URL empty — supabase status failed" && exit 1
          [[ -z "$ANON_KEY" ]] && echo "ERROR: ANON_KEY empty — supabase status failed" && exit 1
          [[ -z "$SERVICE_ROLE_KEY" ]] && echo "ERROR: SERVICE_ROLE_KEY empty — supabase status failed" && exit 1
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV

      - name: Build
        run: npm run build
        env:
          NOTIFICATIONS_ENABLED: "false"

      - name: Start app
        run: nohup npm start -- -p 3001 & disown
        env:
          NOTIFICATIONS_ENABLED: "false"

      - name: Wait for app
        run: timeout 30 bash -c 'until curl -sf http://localhost:3001 > /dev/null; do sleep 1; done'

      - name: Run Playwright tests (in container)
        # Path D: keep the job on the host runner (so supabase + npm + build all
        # work natively against host docker without DiD pain), but run the test
        # step inside the Playwright image so we skip the ~6 min `--with-deps`
        # apt install. We control this `docker run` ourselves, so --network host
        # works (GHA only conflicts with `container:` jobs).
        run: |
          docker run --rm \
            --network host \
            -v "$PWD:/app" \
            -w /app \
            -e PLAYWRIGHT_BASE_URL=http://localhost:3001 \
            -e NOTIFICATIONS_ENABLED=false \
            -e CI=true \
            -e NEXT_PUBLIC_SUPABASE_URL \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY \
            -e SUPABASE_SERVICE_ROLE_KEY \
            -e DATABASE_URL \
            -e SESSION_SECRET \
            mcr.microsoft.com/playwright:v1.59.1-noble \
            npx playwright test

      - name: Fix report ownership (container writes as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" playwright-report || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
